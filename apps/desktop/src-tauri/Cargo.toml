[package]
name = "strizh"
version = "0.1.2"
description = "Стриж — Jabber-клиент"
authors = ["Стриж"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "strizh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Для macOS: WKWebView по умолчанию; для Linux/Windows — системный WebView.
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
